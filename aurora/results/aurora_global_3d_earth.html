<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA - Global Fire Earth</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
        }
        #earth-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 380px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(20, 20, 20, 0.9));
            border: 2px solid #28a745;
            border-radius: 15px;
            padding: 25px;
            color: white;
            z-index: 1000;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .control-panel h2 {
            margin-top: 0;
            color: #28a745;
            text-align: center;
        }
        .control-panel label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        .control-panel select, .control-panel input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #28a745;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .control-panel button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-size: 16px;
        }
        .control-panel button:hover {
            background: #218838;
        }
        .fire-info {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 20px;
            color: white;
            z-index: 1000;
            backdrop-filter: blur(10px);
            display: none;
        }
        .simulation-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 400px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #007bff;
            border-radius: 10px;
            padding: 20px;
            color: white;
            z-index: 1000;
            backdrop-filter: blur(10px);
            display: none;
        }
        .status-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #666;
            border-radius: 5px;
            padding: 10px;
            color: white;
            z-index: 1000;
        }
        .fire-dropdown {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(40, 20, 0, 0.9));
            border: 2px solid #ff8800;
            border-radius: 15px;
            padding: 25px;
            color: white;
            z-index: 1000;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(255, 136, 0, 0.2);
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 1001;
        }
        .leaflet-popup-content {
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .fire-popup {
            background: rgba(255, 68, 68, 0.1);
            border-left: 4px solid #ff4444;
            padding: 10px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="earth-container">
        <div class="loading" id="loading">Loading AURORA Earth...</div>
        <div id="map"></div>
    </div>
    
    <div class="control-panel">
        <h2>🌍 AURORA Global Fire Control</h2>
        
        <label>Select Country:</label>
        <select id="country-select" onchange="filterFires()">
            <option value="all">All Countries</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="AU">Australia</option>
            <option value="BR">Brazil</option>
            <option value="RU">Russia</option>
            <option value="CN">China</option>
            <option value="IN">India</option>
            <option value="ZA">South Africa</option>
            <option value="AR">Argentina</option>
            <option value="MX">Mexico</option>
        </select>
        
        <label>Fire Type:</label>
        <select id="fire-type-select" onchange="filterFires()">
            <option value="all">All Types</option>
            <option value="SV-C2">Suomi NPP VIIRS</option>
            <option value="M-C61">MODIS</option>
            <option value="J1V-C2">NOAA-20 VIIRS</option>
            <option value="J2V-C2">NOAA-21 VIIRS</option>
            <option value="LS">Landsat</option>
        </select>
        
        <label>Date Range:</label>
        <input type="date" id="start-date" value="2024-01-01" onchange="filterFires()">
        <input type="date" id="end-date" value="2024-12-31" onchange="filterFires()">
        
        <button onclick="loadGlobalFireData()">🔥 Load Fire Data</button>
        <button onclick="resetView()">🔄 Reset View</button>
        <button onclick="toggleSimulationMode()">🚁 Simulation Mode</button>
        <button onclick="toggleFireDropdown()">📋 Show Fire List</button>
    </div>
    
    <div class="fire-dropdown" id="fire-dropdown" style="display: none;">
        <h3>🔥 Fire Selection</h3>
        <label>Select Specific Fire:</label>
        <select id="fire-list-select" onchange="selectFireFromList()">
            <option value="">Choose a fire...</option>
        </select>
        <button onclick="toggleFireDropdown()">Close</button>
    </div>
    
    <div class="fire-info" id="fire-info">
        <h3>🔥 Fire Details</h3>
        <div id="fire-details"></div>
        <button onclick="zoomToFire()">🔍 Zoom to Fire</button>
        <button onclick="startFireSimulation()">🚁 Start Simulation</button>
    </div>
    
    <div class="simulation-panel" id="simulation-panel">
        <h3>🚁 Drone Simulation</h3>
        <label>Number of Drones:</label>
        <input type="number" id="drone-count" value="3" min="1" max="10">
        
        <label>Simulation Duration (minutes):</label>
        <input type="number" id="sim-duration" value="30" min="5" max="120">
        
        <label>Wind Speed (mph):</label>
        <input type="number" id="wind-speed" value="15" min="0" max="50">
        
        <label>Wind Direction:</label>
        <select id="wind-direction">
            <option value="N">North</option>
            <option value="NE">Northeast</option>
            <option value="E">East</option>
            <option value="SE">Southeast</option>
            <option value="S">South</option>
            <option value="SW">Southwest</option>
            <option value="W">West</option>
            <option value="NW">Northwest</option>
        </select>
        
        <button onclick="startSimulation()">🚀 Start Simulation</button>
        <button onclick="stopSimulation()">⏹️ Stop Simulation</button>
        <button onclick="resetSimulation()">🔄 Reset</button>
    </div>
    
    <div class="status-bar">
        <div>🌍 Fires: <span id="fire-count">0</span></div>
        <div>🚁 Drones: <span id="drone-count-display">0</span></div>
        <div>📍 Location: <span id="current-location">Global</span></div>
    </div>

    <script>
        // Global variables
        let map;
        let fireMarkers = [];
        let droneMarkers = [];
        let currentFire = null;
        let simulationActive = false;
        let globalFireData = [];
        let filteredFireData = [];
        
        // Initialize Leaflet Map
        function initMap() {
            console.log("Initializing Leaflet Map...");
            
            try {
                // Create map centered on world
                map = L.map('map').setView([20, 0], 2);
                
                // Add satellite tile layer
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
                }).addTo(map);
                
                // Add terrain layer as option
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                });
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                console.log("Leaflet Map initialized successfully!");
                
                // Load initial fire data
                loadGlobalFireData();
                
            } catch (error) {
                console.error('Error initializing Leaflet Map:', error);
                document.getElementById('loading').textContent = 'Error loading map: ' + error.message;
            }
        }
        
        // Load global fire data
        function loadGlobalFireData() {
            console.log("Loading global fire data...");
            
            // Generate sample global fire data
            globalFireData = generateGlobalFireData();
            filteredFireData = [...globalFireData];
            
            // Clear existing markers
            clearFireMarkers();
            
            // Add fire markers
            addFireMarkersToMap(filteredFireData);
            
            // Update fire list dropdown
            updateFireList();
            
            // Update status
            document.getElementById('fire-count').textContent = filteredFireData.length;
            document.getElementById('current-location').textContent = 'Global';
            
            console.log("Loaded", filteredFireData.length, "fires");
        }
        
        // Filter fires based on controls
        function filterFires() {
            const country = document.getElementById('country-select').value;
            const fireType = document.getElementById('fire-type-select').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            console.log("Filtering fires:", { country, fireType, startDate, endDate });
            
            // Filter the data
            filteredFireData = globalFireData.filter(fire => {
                let matches = true;
                
                // Filter by country
                if (country !== 'all' && fire.country !== country) {
                    matches = false;
                }
                
                // Filter by fire type
                if (fireType !== 'all' && fire.type !== fireType) {
                    matches = false;
                }
                
                // Filter by date range
                const fireDate = new Date(fire.date);
                const start = new Date(startDate);
                const end = new Date(endDate);
                
                if (fireDate < start || fireDate > end) {
                    matches = false;
                }
                
                return matches;
            });
            
            // Clear existing markers
            clearFireMarkers();
            
            // Add filtered fire markers
            addFireMarkersToMap(filteredFireData);
            
            // Update fire list dropdown
            updateFireList();
            
            // Update status
            document.getElementById('fire-count').textContent = filteredFireData.length;
            document.getElementById('current-location').textContent = country === 'all' ? 'Global' : country;
            
            console.log("Filtered to", filteredFireData.length, "fires");
        }
        
        // Generate realistic global fire data
        function generateGlobalFireData() {
            const fires = [];
            const countries = {
                'US': { 
                    lat: 39.8283, lng: -98.5795, name: 'United States',
                    regions: [
                        { name: 'California', lat: 36.7783, lng: -119.4179, fireProne: true },
                        { name: 'Oregon', lat: 43.8041, lng: -120.5542, fireProne: true },
                        { name: 'Washington', lat: 47.4009, lng: -121.4905, fireProne: true },
                        { name: 'Texas', lat: 31.9686, lng: -99.9018, fireProne: true },
                        { name: 'Florida', lat: 27.6648, lng: -81.5158, fireProne: false }
                    ]
                },
                'CA': { 
                    lat: 56.1304, lng: -106.3468, name: 'Canada',
                    regions: [
                        { name: 'British Columbia', lat: 53.7267, lng: -127.6476, fireProne: true },
                        { name: 'Alberta', lat: 55.0000, lng: -115.0000, fireProne: true },
                        { name: 'Ontario', lat: 50.0000, lng: -85.0000, fireProne: false }
                    ]
                },
                'AU': { 
                    lat: -25.2744, lng: 133.7751, name: 'Australia',
                    regions: [
                        { name: 'New South Wales', lat: -33.8688, lng: 151.2093, fireProne: true },
                        { name: 'Victoria', lat: -37.8136, lng: 144.9631, fireProne: true },
                        { name: 'Queensland', lat: -23.4691, lng: 144.9769, fireProne: true }
                    ]
                },
                'BR': { 
                    lat: -14.2350, lng: -51.9253, name: 'Brazil',
                    regions: [
                        { name: 'Amazonas', lat: -3.4168, lng: -65.8561, fireProne: true },
                        { name: 'Mato Grosso', lat: -15.6010, lng: -56.0974, fireProne: true },
                        { name: 'Rondonia', lat: -8.7619, lng: -63.9039, fireProne: true }
                    ]
                },
                'RU': { 
                    lat: 61.5240, lng: 105.3188, name: 'Russia',
                    regions: [
                        { name: 'Siberia', lat: 60.0000, lng: 100.0000, fireProne: true },
                        { name: 'Yakutia', lat: 66.0000, lng: 129.0000, fireProne: true },
                        { name: 'Krasnoyarsk', lat: 56.0000, lng: 93.0000, fireProne: true }
                    ]
                },
                'CN': { 
                    lat: 35.8617, lng: 104.1954, name: 'China',
                    regions: [
                        { name: 'Inner Mongolia', lat: 44.0000, lng: 113.0000, fireProne: true },
                        { name: 'Heilongjiang', lat: 48.0000, lng: 128.0000, fireProne: true },
                        { name: 'Yunnan', lat: 25.0000, lng: 102.0000, fireProne: false }
                    ]
                },
                'IN': { 
                    lat: 20.5937, lng: 78.9629, name: 'India',
                    regions: [
                        { name: 'Uttarakhand', lat: 30.0668, lng: 79.0193, fireProne: true },
                        { name: 'Himachal Pradesh', lat: 31.1048, lng: 77.1734, fireProne: true },
                        { name: 'Jammu & Kashmir', lat: 33.7782, lng: 76.5762, fireProne: true }
                    ]
                },
                'ZA': { 
                    lat: -30.5595, lng: 22.9375, name: 'South Africa',
                    regions: [
                        { name: 'Western Cape', lat: -33.9249, lng: 18.4241, fireProne: true },
                        { name: 'Eastern Cape', lat: -32.2968, lng: 26.4194, fireProne: true },
                        { name: 'KwaZulu-Natal', lat: -28.5306, lng: 30.8958, fireProne: false }
                    ]
                },
                'AR': { 
                    lat: -38.4161, lng: -63.6167, name: 'Argentina',
                    regions: [
                        { name: 'Patagonia', lat: -42.0000, lng: -70.0000, fireProne: true },
                        { name: 'Misiones', lat: -27.0000, lng: -55.0000, fireProne: true },
                        { name: 'Buenos Aires', lat: -34.6037, lng: -58.3816, fireProne: false }
                    ]
                },
                'MX': { 
                    lat: 23.6345, lng: -102.5528, name: 'Mexico',
                    regions: [
                        { name: 'Baja California', lat: 30.8406, lng: -115.2838, fireProne: true },
                        { name: 'Chihuahua', lat: 28.6353, lng: -106.0889, fireProne: true },
                        { name: 'Oaxaca', lat: 17.0732, lng: -96.7266, fireProne: true }
                    ]
                }
            };
            
            const fireTypes = [
                { code: 'SV-C2', name: 'Suomi NPP VIIRS', description: 'Suomi National Polar-orbiting Partnership Visible Infrared Imaging Radiometer Suite' },
                { code: 'M-C61', name: 'MODIS', description: 'Moderate Resolution Imaging Spectroradiometer' },
                { code: 'J1V-C2', name: 'NOAA-20 VIIRS', description: 'NOAA-20 Visible Infrared Imaging Radiometer Suite' },
                { code: 'J2V-C2', name: 'NOAA-21 VIIRS', description: 'NOAA-21 Visible Infrared Imaging Radiometer Suite' },
                { code: 'LS', name: 'Landsat', description: 'Landsat Satellite System' }
            ];
            
            // Generate realistic fires for all countries
            Object.keys(countries).forEach(countryCode => {
                const countryData = countries[countryCode];
                
                countryData.regions.forEach(region => {
                    const baseFireCount = region.fireProne ? Math.floor(Math.random() * 15) + 8 : Math.floor(Math.random() * 5) + 2;
                    
                    for (let i = 0; i < baseFireCount; i++) {
                        const fireType = fireTypes[Math.floor(Math.random() * fireTypes.length)];
                        const intensity = Math.floor(Math.random() * 100) + 1;
                        const size = Math.floor(Math.random() * 5000) + 100;
                        
                        // Generate realistic coordinates within the region
                        const lat = region.lat + (Math.random() - 0.5) * 8;
                        const lng = region.lng + (Math.random() - 0.5) * 8;
                        
                        // Generate realistic date (recent fires)
                        const daysAgo = Math.floor(Math.random() * 30);
                        const date = new Date();
                        date.setDate(date.getDate() - daysAgo);
                        
                        const fire = {
                            id: `${countryCode}_${region.name.replace(/\s+/g, '_')}_${i}`,
                            lat: lat,
                            lng: lng,
                            country: countryCode,
                            countryName: countryData.name,
                            region: region.name,
                            type: fireType.code,
                            typeName: fireType.name,
                            typeDescription: fireType.description,
                            intensity: intensity,
                            date: date,
                            size: size,
                            status: intensity > 70 ? 'Active' : intensity > 30 ? 'Moderate' : 'Low',
                            confidence: Math.floor(Math.random() * 30) + 70 // 70-100% confidence
                        };
                        fires.push(fire);
                    }
                });
            });
            
            console.log(`Generated ${fires.length} realistic fires across ${Object.keys(countries).length} countries`);
            return fires;
        }
        
        // Add fire markers to map with enhanced styling
        function addFireMarkersToMap(fires) {
            if (!map) {
                console.error('Map not ready');
                return;
            }
            
            fires.forEach((fire, index) => {
                // Create custom fire marker with size based on intensity
                const markerSize = Math.max(8, Math.min(20, fire.intensity / 5));
                const markerOpacity = Math.max(0.6, Math.min(1.0, fire.intensity / 100));
                
                // Create custom icon
                const fireIcon = L.divIcon({
                    className: 'fire-marker',
                    html: `<div style="
                        width: ${markerSize}px; 
                        height: ${markerSize}px; 
                        background-color: ${getFireColor(fire.type)}; 
                        border: 2px solid white; 
                        border-radius: 50%; 
                        opacity: ${markerOpacity};
                        box-shadow: 0 0 10px ${getFireColor(fire.type)};
                        animation: pulse 2s infinite;
                    "></div>`,
                    iconSize: [markerSize, markerSize],
                    iconAnchor: [markerSize/2, markerSize/2]
                });
                
                const marker = L.marker([fire.lat, fire.lng], { icon: fireIcon }).addTo(map);
                
                // Add popup with fire information
                const popupContent = `
                    <div class="fire-popup">
                        <h4 style="color: ${getFireColor(fire.type)}; margin: 0 0 10px 0;">🔥 ${fire.status} Fire</h4>
                        <p><strong>📍 Location:</strong> ${fire.region}, ${fire.countryName}</p>
                        <p><strong>🌍 Coordinates:</strong> ${fire.lat.toFixed(4)}, ${fire.lng.toFixed(4)}</p>
                        <p><strong>📡 Satellite:</strong> ${fire.typeName}</p>
                        <p><strong>🔥 Intensity:</strong> ${fire.intensity}/100</p>
                        <p><strong>📏 Size:</strong> ${fire.size.toLocaleString()} acres</p>
                        <p><strong>📅 Detected:</strong> ${fire.date.toLocaleDateString()}</p>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                
                // Add click listener
                marker.on('click', () => {
                    showFireInfo(fire);
                });
                
                fireMarkers.push(marker);
            });
        }
        
        // Get fire color based on type
        function getFireColor(type) {
            const colors = {
                'SV-C2': '#ff4444',
                'M-C61': '#ff8800',
                'J1V-C2': '#ffff00',
                'J2V-C2': '#8800ff',
                'LS': '#8b4513'
            };
            return colors[type] || '#ff4444';
        }
        
        // Show detailed fire information
        function showFireInfo(fire) {
            currentFire = fire;
            const fireInfo = document.getElementById('fire-info');
            const fireDetails = document.getElementById('fire-details');
            
            // Get status color
            const statusColor = fire.status === 'Active' ? '#ff4444' : fire.status === 'Moderate' ? '#ff8800' : '#ffff00';
            
            fireDetails.innerHTML = `
                <div style="margin-bottom: 15px;">
                    <h4 style="color: ${statusColor}; margin: 0 0 10px 0;">🔥 ${fire.status} Fire</h4>
                    <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; margin-bottom: 10px;">
                        <p style="margin: 5px 0;"><strong>📍 Location:</strong> ${fire.region}, ${fire.countryName}</p>
                        <p style="margin: 5px 0;"><strong>🌍 Coordinates:</strong> ${fire.lat.toFixed(4)}, ${fire.lng.toFixed(4)}</p>
                    </div>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <h5 style="margin: 0 0 8px 0; color: #28a745;">📡 Satellite Data</h5>
                    <p style="margin: 5px 0;"><strong>Satellite:</strong> ${fire.typeName}</p>
                    <p style="margin: 5px 0;"><strong>Type Code:</strong> ${fire.type}</p>
                    <p style="margin: 5px 0;"><strong>Confidence:</strong> ${fire.confidence}%</p>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <h5 style="margin: 0 0 8px 0; color: #ff8800;">🔥 Fire Details</h5>
                    <p style="margin: 5px 0;"><strong>Intensity:</strong> <span style="color: ${statusColor};">${fire.intensity}/100</span></p>
                    <p style="margin: 5px 0;"><strong>Size:</strong> ${fire.size.toLocaleString()} acres</p>
                    <p style="margin: 5px 0;"><strong>Detected:</strong> ${fire.date.toLocaleDateString()} at ${fire.date.toLocaleTimeString()}</p>
                </div>
                
                <div style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 3px; font-size: 12px; color: #ccc;">
                    <strong>Description:</strong> ${fire.typeDescription}
                </div>
            `;
            
            fireInfo.style.display = 'block';
        }
        
        // Zoom to fire
        function zoomToFire() {
            if (!currentFire || !map) return;
            
            map.setView([currentFire.lat, currentFire.lng], 8);
            
            document.getElementById('current-location').textContent = currentFire.countryName;
        }
        
        // Toggle fire dropdown
        function toggleFireDropdown() {
            const dropdown = document.getElementById('fire-dropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }
        
        // Update fire list dropdown with detailed information
        function updateFireList() {
            const select = document.getElementById('fire-list-select');
            select.innerHTML = '<option value="">Choose a fire...</option>';
            
            // Group fires by country for better organization
            const groupedFires = {};
            filteredFireData.forEach(fire => {
                if (!groupedFires[fire.countryName]) {
                    groupedFires[fire.countryName] = [];
                }
                groupedFires[fire.countryName].push(fire);
            });
            
            Object.keys(groupedFires).forEach(country => {
                // Add country group header
                const countryOption = document.createElement('option');
                countryOption.value = '';
                countryOption.textContent = `━━━ ${country} (${groupedFires[country].length} fires) ━━━`;
                countryOption.disabled = true;
                select.appendChild(countryOption);
                
                // Add fires for this country
                groupedFires[country].forEach(fire => {
                    const option = document.createElement('option');
                    option.value = fire.id;
                    const statusIcon = fire.status === 'Active' ? '🔥' : fire.status === 'Moderate' ? '🟠' : '🟡';
                    option.textContent = `${statusIcon} ${fire.region} - ${fire.typeName} (${fire.intensity}/100)`;
                    select.appendChild(option);
                });
            });
        }
        
        // Select fire from list
        function selectFireFromList() {
            const select = document.getElementById('fire-list-select');
            const fireId = select.value;
            
            if (fireId) {
                const fire = filteredFireData.find(f => f.id === fireId);
                if (fire) {
                    showFireInfo(fire);
                    zoomToFire();
                }
            }
        }
        
        // Toggle simulation mode
        function toggleSimulationMode() {
            const simulationPanel = document.getElementById('simulation-panel');
            simulationPanel.style.display = simulationPanel.style.display === 'none' ? 'block' : 'none';
        }
        
        // Start fire simulation
        function startFireSimulation() {
            if (!currentFire) return;
            
            toggleSimulationMode();
            document.getElementById('current-location').textContent = currentFire.countryName;
        }
        
        // Start simulation
        function startSimulation() {
            if (!currentFire || !map) return;
            
            simulationActive = true;
            const droneCount = parseInt(document.getElementById('drone-count').value);
            
            // Clear existing drones
            clearDroneMarkers();
            
            // Add drones
            for (let i = 0; i < droneCount; i++) {
                addDrone(i);
            }
            
            document.getElementById('drone-count-display').textContent = droneCount;
            
            console.log(`Started simulation with ${droneCount} drones around fire at ${currentFire.lat}, ${currentFire.lng}`);
        }
        
        // Add drone
        function addDrone(id) {
            if (!map) return;
            
            const radius = 0.1; // 0.1 degrees radius
            const angle = (id * 2 * Math.PI) / parseInt(document.getElementById('drone-count').value);
            
            const droneLat = currentFire.lat + radius * Math.cos(angle);
            const droneLng = currentFire.lng + radius * Math.sin(angle);
            
            // Create drone icon
            const droneIcon = L.divIcon({
                className: 'drone-marker',
                html: `<div style="
                    width: 12px; 
                    height: 12px; 
                    background-color: #00ff00; 
                    border: 2px solid white; 
                    border-radius: 50%; 
                    box-shadow: 0 0 10px #00ff00;
                    animation: bounce 1s infinite;
                "></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });
            
            const drone = L.marker([droneLat, droneLng], { icon: droneIcon }).addTo(map);
            
            droneMarkers.push(drone);
        }
        
        // Stop simulation
        function stopSimulation() {
            simulationActive = false;
            console.log("Simulation stopped");
        }
        
        // Reset simulation
        function resetSimulation() {
            simulationActive = false;
            clearDroneMarkers();
            document.getElementById('drone-count-display').textContent = '0';
            console.log("Simulation reset");
        }
        
        // Clear fire markers
        function clearFireMarkers() {
            fireMarkers.forEach(marker => map.removeLayer(marker));
            fireMarkers = [];
        }
        
        // Clear drone markers
        function clearDroneMarkers() {
            droneMarkers.forEach(marker => map.removeLayer(marker));
            droneMarkers = [];
        }
        
        // Reset view
        function resetView() {
            if (map) {
                map.setView([20, 0], 2);
            }
            
            document.getElementById('fire-info').style.display = 'none';
            document.getElementById('simulation-panel').style.display = 'none';
            document.getElementById('fire-dropdown').style.display = 'none';
            currentFire = null;
            simulationActive = false;
            clearDroneMarkers();
        }
        
        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { opacity: 0.7; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.1); }
                100% { opacity: 0.7; transform: scale(1); }
            }
            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-5px); }
            }
        `;
        document.head.appendChild(style);
        
        // Initialize everything when page loads
        window.addEventListener('load', function() {
            console.log("Page loaded, initializing Leaflet Map...");
            initMap();
        });
    </script>
</body>
</html>
