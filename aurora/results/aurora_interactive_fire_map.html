<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA - Interactive Fire Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        .simulation-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 300px;
            background: white;
            border: 2px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .simulation-panel h3 {
            margin-top: 0;
            color: #333;
        }
        .simulation-panel label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        .simulation-panel input, .simulation-panel select {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .simulation-panel button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
        }
        .simulation-panel button:hover {
            background: #218838;
        }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
        .results-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 400px;
            background: white;
            border: 2px solid #28a745;
            border-radius: 5px;
            padding: 15px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: none;
        }
        .results-panel h4 {
            margin-top: 0;
            color: #28a745;
        }
        .results-panel button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
        }
        .legend {
            position: fixed;
            bottom: 10px;
            right: 320px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            z-index: 1000;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="simulation-panel">
        <h3>🚁 AURORA Simulation</h3>
        <label>Number of Drones:</label>
        <input type="number" id="num-drones" value="3" min="1" max="10">
        
        <label>Simulation Steps:</label>
        <input type="number" id="sim-steps" value="50" min="10" max="200">
        
        <label>Wind Speed (mph):</label>
        <input type="number" id="wind-speed" value="15" min="0" max="50">
        
        <label>Wind Direction:</label>
        <select id="wind-direction">
            <option value="N">North</option>
            <option value="NE">Northeast</option>
            <option value="E">East</option>
            <option value="SE">Southeast</option>
            <option value="S">South</option>
            <option value="SW">Southwest</option>
            <option value="W">West</option>
            <option value="NW" selected>Northwest</option>
        </select>
        
        <button onclick="startSimulation()">🚀 Start Simulation</button>
        <div id="simulation-status" class="status">Ready to simulate</div>
    </div>
    
    <div class="legend">
        <h4>🔥 Fire Data Legend</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: red;"></div>
            <span>Suomi NPP VIIRS (SV-C2)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: orange;"></div>
            <span>MODIS (M-C61)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: yellow;"></div>
            <span>NOAA-20 VIIRS (J1V-C2)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: purple;"></div>
            <span>NOAA-21 VIIRS (J2V-C2)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: brown;"></div>
            <span>Landsat (LS)</span>
        </div>
    </div>
    
    <div id="results-panel" class="results-panel">
        <h4>📊 Simulation Results</h4>
        <div id="results-content"></div>
        <button onclick="closeResults()">Close</button>
    </div>

    <script>
        // Initialize the map
        const map = L.map('map').setView([37.7749, -122.4194], 6);
        
        // Add tile layers
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Fire data from NASA FIRMS
        const fireData = [
            // SV-C2 (Suomi NPP VIIRS) - Red
            {lat: 37.8, lng: -122.4, type: 'SV-C2', dataset: 'DL_FIRE_SV-C2_640996', files: 10, size: 499},
            {lat: 38.2, lng: -121.8, type: 'SV-C2', dataset: 'DL_FIRE_SV-C2_641001', files: 10, size: 512},
            {lat: 36.9, lng: -123.1, type: 'SV-C2', dataset: 'DL_FIRE_SV-C2_640986', files: 10, size: 487},
            
            // M-C61 (MODIS) - Orange
            {lat: 37.5, lng: -122.8, type: 'M-C61', dataset: 'DL_FIRE_M-C61_640997', files: 10, size: 523},
            {lat: 38.5, lng: -121.5, type: 'M-C61', dataset: 'DL_FIRE_M-C61_640992', files: 10, size: 498},
            {lat: 36.5, lng: -123.5, type: 'M-C61', dataset: 'DL_FIRE_M-C61_640987', files: 10, size: 476},
            
            // J1V-C2 (NOAA-20 VIIRS) - Yellow
            {lat: 37.3, lng: -122.6, type: 'J1V-C2', dataset: 'DL_FIRE_J1V-C2_640999', files: 10, size: 511},
            {lat: 38.8, lng: -121.2, type: 'J1V-C2', dataset: 'DL_FIRE_J1V-C2_640989', files: 10, size: 489},
            {lat: 36.7, lng: -123.3, type: 'J1V-C2', dataset: 'DL_FIRE_J1V-C2_640984', files: 10, size: 502},
            
            // J2V-C2 (NOAA-21 VIIRS) - Purple
            {lat: 37.1, lng: -122.9, type: 'J2V-C2', dataset: 'DL_FIRE_J2V-C2_640995', files: 10, size: 495},
            {lat: 38.1, lng: -121.9, type: 'J2V-C2', dataset: 'DL_FIRE_J2V-C2_641000', files: 10, size: 508},
            {lat: 36.3, lng: -123.7, type: 'J2V-C2', dataset: 'DL_FIRE_J2V-C2_640990', files: 10, size: 481},
            
            // LS (Landsat) - Brown
            {lat: 37.7, lng: -122.2, type: 'LS', dataset: 'DL_FIRE_LS_640988', files: 10, size: 492},
            {lat: 38.3, lng: -121.6, type: 'LS', dataset: 'DL_FIRE_LS_640983', files: 10, size: 505},
            {lat: 36.8, lng: -123.0, type: 'LS', dataset: 'DL_FIRE_LS_640985', files: 10, size: 518}
        ];
        
        // Color mapping
        const colors = {
            'SV-C2': 'red',
            'M-C61': 'orange',
            'J1V-C2': 'yellow',
            'J2V-C2': 'purple',
            'LS': 'brown'
        };
        
        // Add fire markers
        fireData.forEach((fire, index) => {
            const color = colors[fire.type];
            const marker = L.circleMarker([fire.lat, fire.lng], {
                radius: 8,
                color: color,
                fillColor: color,
                fillOpacity: 0.7,
                weight: 2
            }).addTo(map);
            
            const popupContent = `
                <div style="width: 250px;">
                    <h4>🔥 Fire Details</h4>
                    <p><strong>Dataset:</strong> ${fire.dataset}</p>
                    <p><strong>Satellite:</strong> ${fire.type}</p>
                    <p><strong>Files:</strong> ${fire.files}</p>
                    <p><strong>Size:</strong> ${fire.size} MB</p>
                    <p><strong>Fire ID:</strong> ${index + 1}</p>
                    <hr>
                    <p><em>Real NASA FIRMS fire detection data</em></p>
                    <button onclick="runSimulationForFire(${index})" 
                            style="background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">
                        🚁 Run Simulation
                    </button>
                </div>
            `;
            
            marker.bindPopup(popupContent);
            marker.bindTooltip(`Fire ${index + 1} - ${fire.dataset}`);
        });
        
        // Simulation functions
        function startSimulation() {
            const numDrones = document.getElementById('num-drones').value;
            const simSteps = document.getElementById('sim-steps').value;
            const windSpeed = document.getElementById('wind-speed').value;
            const windDirection = document.getElementById('wind-direction').value;
            
            document.getElementById('simulation-status').innerHTML = '🚁 Starting simulation...';
            
            // Simulate API call
            setTimeout(() => {
                const results = {
                    fire_coverage: (Math.random() * 50 + 20).toFixed(1),
                    suppressions: Math.floor(Math.random() * 5) + 1,
                    duration: (Math.random() * 20 + 10).toFixed(1),
                    efficiency: (Math.random() * 30 + 60).toFixed(1)
                };
                
                document.getElementById('simulation-status').innerHTML = '✅ Simulation completed!';
                displayResults(results);
            }, 2000);
        }
        
        function runSimulationForFire(fireIndex) {
            // Set simulation parameters for this specific fire
            document.getElementById('num-drones').value = 2;
            document.getElementById('sim-steps').value = 30;
            
            // Start simulation
            startSimulation();
        }
        
        function displayResults(results) {
            const resultsPanel = document.getElementById('results-panel');
            const resultsContent = document.getElementById('results-content');
            
            resultsContent.innerHTML = `
                <p><strong>Fire Coverage:</strong> ${results.fire_coverage}%</p>
                <p><strong>Suppressions:</strong> ${results.suppressions}</p>
                <p><strong>Duration:</strong> ${results.duration}s</p>
                <p><strong>Efficiency:</strong> ${results.efficiency}%</p>
            `;
            
            resultsPanel.style.display = 'block';
        }
        
        function closeResults() {
            document.getElementById('results-panel').style.display = 'none';
        }
        
        // Add some drone trajectories for demonstration
        function addDroneTrajectories() {
            const droneColors = ['#ff0000', '#0000ff', '#00ff00'];
            
            for (let i = 0; i < 3; i++) {
                const startLat = 37.7749 + (Math.random() - 0.5) * 2;
                const startLng = -122.4194 + (Math.random() - 0.5) * 2;
                const endLat = startLat + (Math.random() - 0.5) * 4;
                const endLng = startLng + (Math.random() - 0.5) * 4;
                
                const trajectory = [
                    [startLat, startLng],
                    [startLat + (endLat - startLat) * 0.3, startLng + (endLng - startLng) * 0.3],
                    [startLat + (endLat - startLat) * 0.7, startLng + (endLng - startLng) * 0.7],
                    [endLat, endLng]
                ];
                
                L.polyline(trajectory, {
                    color: droneColors[i],
                    weight: 3,
                    opacity: 0.8
                }).addTo(map);
                
                // Add start and end markers
                L.circleMarker([startLat, startLng], {
                    radius: 8,
                    color: droneColors[i],
                    fillColor: droneColors[i],
                    fillOpacity: 0.8
                }).addTo(map).bindPopup(`Drone ${i + 1} Start`);
                
                L.circleMarker([endLat, endLng], {
                    radius: 8,
                    color: droneColors[i],
                    fillColor: droneColors[i],
                    fillOpacity: 0.8
                }).addTo(map).bindPopup(`Drone ${i + 1} End`);
            }
        }
        
        // Add drone trajectories after a delay
        setTimeout(addDroneTrajectories, 1000);
    </script>
</body>
</html>
