[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-wildfire"
version = "0.4.0"
description = "Deterministic benchmark, replay, and fault-injection tools for multi-agent wildfire-response experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Shaurya Mallampati", email = "shauryasai@gmail.com"},
  {name = "Ankit Mohanty"},
]
keywords = ["wildfire", "multi-agent systems", "simulation", "fault injection", "PettingZoo", "research software"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
figures = ["matplotlib>=3.8,<4"]
interfaces = ["gymnasium>=1.0,<2", "pettingzoo>=1.24,<2"]

[project.scripts]
aurora = "aurora.cli:main"

[project.urls]
Repository = "https://github.com/ShauryaMallampati/Aurora"
Issues = "https://github.com/ShauryaMallampati/Aurora/issues"
Documentation = "https://github.com/ShauryaMallampati/Aurora/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["aurora"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
