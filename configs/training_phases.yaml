# AURORA ISEF 2025 training config
# Tuned for a realistic ISEF timeline with n_envs=4
# Total: 400K env steps across 3 phases (~8-12 hours)

# PPO params (n_steps=2048, num_envs=4 -> 8192 steps/update)
ppo_defaults:
  n_steps: 2048
  num_envs: 2
  batch_size: 256
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 3e-4
  steps_per_update: 4096  # n_steps x num_envs (2048 x 2)

# Checkpointing + evaluation
checkpoint:
  save_every_steps: 5000       # Save every 5K steps for resume
  save_every_updates: 5
  keep_top_n: 10               # Keep more checkpoints for safety
  eval_every_updates: 10
  enable_resume: true          # Allow resuming from last checkpoint
  
eval_splits:
  temporal: "all_years"        # Use all years (1308-2024)
  geographic: "all_us_states"  # Use all US states (no holdout)

# Metrics to track
metrics:
  - mean_return
  - return_95ci
  - median_area_burned
  - containment_steps
  - idle_steps_per_agent
  - completion_rate
  - action_distribution
  - llm_latency
  - llm_cache_hit_rate

# ========== PHASE A: SANITY + OVERFIT ==========
phase_a:
  name: "Sanity Check & Real Data Overfit"
  purpose: "Verify learning works and model locks onto real fire patterns"
  
  updates: 7             # 7 x 8192 ~ 57K steps
  env_steps: 57_344      # ~50K for quick sanity check
  
  # Data settings
  scenario_pool_size: 1000  # Smaller pool to overfit
  fire_size_range: [10, 100]
  wind_speed_range: [0, 15]
  
  # LLM settings (less frequent for speed)
  llm_cadence: 500  # Guidance every 500 steps (reduced from 50)
  llm_model: "Qwen/Qwen2.5-1.5B-Instruct"  # Lightweight 1.5B model
  
  # Reward weights
  reward_weights:
    containment_progress: 1.5
    area_saved: 1.0
    idle_penalty: 0.3
    resource_efficiency: 0.5
  
  # PPO settings
  ppo:
    entropy_coef: 0.02
    learning_rate: 3e-4
  
  # Early stop criteria
  early_stop:
    plateau_updates: 30
    idle_steps_threshold: 3.0
    return_improvement_threshold: 0.01

# ========== PHASE B: CURRICULUM SCALING ==========
phase_b:
  name: "Curriculum on Real Data"
  purpose: "Scale difficulty and generality within real dataset"
  
  updates: 18            # 18 x 8192 ~ 147K steps
  env_steps: 147_456     # ~150K for curriculum learning
  
  # Data settings (more complexity)
  scenario_pool_size: 5000
  fire_size_range: [10, 200]
  wind_speed_range: [0, 25]
  slope_variance: 0.3
  horizon: 150  # Longer episodes
  
  # LLM settings (less frequent for speed)
  llm_model: "Qwen/Qwen2.5-1.5B-Instruct"  # Lightweight 1.5B model
  llm_cadence: 500  # Reduced from 50 for speed
  llm_cache_enabled: true
  cache_by: ["fire_id", "t_bucket", "wind_regime"]
  
  # Reward weights (balanced)
  reward_weights:
    containment_progress: 1.0
    area_saved: 1.2
    idle_penalty: 0.4
    resource_efficiency: 0.7
    strategy_alignment: 0.5
  
  # PPO settings
  ppo:
    entropy_coef: 0.015
    learning_rate: 3e-4
  
  # Early stop criteria
  early_stop:
    completion_rate_threshold: 0.85
    area_burned_improvement: 0.01  # 1% improvement threshold
    plateau_updates: 40

# ========== PHASE C: FULL DATASET MIX ==========
phase_c:
  name: "Full Dataset Mix"
  purpose: "Expose broad geography and years, maintain generalization"
  
  updates: 24            # 24 x 8192 ~ 196K steps
  env_steps: 196_608     # ~200K for full dataset exposure
  
  # Data settings (full diversity)
  scenario_pool_size: 116337  # All available fires
  fire_size_range: [5, 300]
  wind_speed_range: [0, 40]
  slope_variance: 0.5
  horizon: 200
  balanced_sampling: true
  
  # Geographic + temporal diversity
  sample_years: [1308, 2024]  # Full range
  sample_states: "all_except_holdout"
  
  # LLM settings (less frequent for speed)
  llm_model: "Qwen/Qwen2.5-1.5B-Instruct"  # Lightweight 1.5B model
  llm_cadence: 500  # Reduced from 50 for speed
  llm_cache_enabled: true
  cache_target_hit_rate: 0.60
  
  # Reward weights (refined)
  reward_weights:
    containment_progress: 1.0
    area_saved: 1.5
    idle_penalty: 0.5
    resource_efficiency: 0.8
    strategy_alignment: 0.6
    terrain_adaptation: 0.4
  
  # PPO settings (anneal entropy)
  ppo:
    entropy_coef_start: 0.02
    entropy_coef_end: 0.005
    entropy_anneal: "linear"
    learning_rate: 3e-4
  
  # Early stop criteria
  early_stop:
    return_95ci_overlap_count: 3
    min_entropy: 0.01

# ========== PHASE D: QWEN FINE-TUNE (OPTIONAL) ==========
phase_d:
  name: "Qwen-Guidance Fine-Tune"
  purpose: "Strengthen strategy use without destabilizing PPO"
  
  updates: 250
  env_steps: 2_048_000  # 250 x 8192 ~ 2.05M
  
  # Data settings (full diversity)
  scenario_pool_size: 116337
  fire_size_range: [5, 300]
  balanced_sampling: true
  
  # LLM settings (optional: reduce cadence on complex scenarios)
  llm_model: "Qwen/Qwen2.5-1.5B-Instruct"  # Lightweight 1.5B model
  llm_cadence: 500  # Reduced for consistency; adjust per-phase when needed
  llm_cache_enabled: true
  
  # Reward weights (emphasize strategy)
  reward_weights:
    containment_progress: 1.0
    area_saved: 1.5
    idle_penalty: 0.5
    resource_efficiency: 0.8
    strategy_alignment: 1.0  # Upweighted
    guidance_consistency: 0.7
  
  # PPO settings (stable)
  ppo:
    entropy_coef: 0.005
    learning_rate: 1e-4  # Lower LR for fine-tuning
  
  # Early stop criteria
  early_stop:
    completion_rate_threshold: 0.90
    eval_consecutive_success: 3

# ========== SUMMARY ==========
total_env_steps: 401_408      # ~400K steps total (optimized for ISEF)
total_updates: 49             # 7 + 18 + 24 = 49 updates
total_wall_time_estimate: "8-12 hours (with n_envs=4)"
recommended_phases_for_isef: ["phase_a", "phase_b", "phase_c"]
optional_phase: "phase_d (deprecated - not needed for 400K training)"

# Quick reference
quick_reference:
  steps_per_update: 8192
  updates_for_50K_steps: 7
  updates_for_150K_steps: 18
  updates_for_200K_steps: 24
  total_for_400K: 49
