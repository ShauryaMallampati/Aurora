# AURORA ISEF 2025 Training Configuration
# Expert-recommended phased training for world-class results
# Total: ~13.12M environment steps across 4 phases

# PPO Parameters (with n_steps=2048, num_envs=4 → 8192 steps/update)
ppo_defaults:
  n_steps: 2048
  num_envs: 4
  batch_size: 256
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 3e-4
  steps_per_update: 8192  # n_steps × num_envs

# Checkpointing & Evaluation
checkpoint:
  save_every_updates: 5
  keep_top_n: 5
  eval_every_updates: 10
  
eval_splits:
  temporal: "years_2020_2024"  # Held-out recent years
  geographic: "CA_WA_OR"       # Held-out western states

# Metrics to Track
metrics:
  - mean_return
  - return_95ci
  - median_area_burned
  - containment_steps
  - idle_steps_per_agent
  - completion_rate
  - action_distribution
  - llm_latency
  - llm_cache_hit_rate

# ========== PHASE A: SANITY + OVERFIT ==========
phase_a:
  name: "Sanity Check & Real Data Overfit"
  purpose: "Verify learning works and model locks onto real fire patterns"
  
  updates: 250
  env_steps: 2_048_000  # 250 × 8192 ≈ 2.05M
  
  # Data settings
  scenario_pool_size: 1000  # Smaller pool to overfit
  fire_size_range: [10, 100]
  wind_speed_range: [0, 15]
  
  # LLM settings
  llm_cadence: 50  # Guidance every 50 steps
  llm_model: "Qwen/Qwen2.5-7B-Instruct"
  
  # Reward weights
  reward_weights:
    containment_progress: 1.5
    area_saved: 1.0
    idle_penalty: 0.3
    resource_efficiency: 0.5
  
  # PPO settings
  ppo:
    entropy_coef: 0.02
    learning_rate: 3e-4
  
  # Early stop criteria
  early_stop:
    plateau_updates: 30
    idle_steps_threshold: 3.0
    return_improvement_threshold: 0.01

# ========== PHASE B: CURRICULUM SCALING ==========
phase_b:
  name: "Curriculum on Real Data"
  purpose: "Scale difficulty and generality within real dataset"
  
  updates: 500
  env_steps: 4_096_000  # 500 × 8192 ≈ 4.10M
  
  # Data settings (increased complexity)
  scenario_pool_size: 5000
  fire_size_range: [10, 200]
  wind_speed_range: [0, 25]
  slope_variance: 0.3
  horizon: 150  # Longer episodes
  
  # LLM settings
  llm_cadence: 50  # Keep at 50, move to 75 if too frequent
  llm_cache_enabled: true
  cache_by: ["fire_id", "t_bucket", "wind_regime"]
  
  # Reward weights (balanced)
  reward_weights:
    containment_progress: 1.0
    area_saved: 1.2
    idle_penalty: 0.4
    resource_efficiency: 0.7
    strategy_alignment: 0.5
  
  # PPO settings
  ppo:
    entropy_coef: 0.015
    learning_rate: 3e-4
  
  # Early stop criteria
  early_stop:
    completion_rate_threshold: 0.85
    area_burned_improvement: 0.01  # 1% improvement threshold
    plateau_updates: 40

# ========== PHASE C: FULL DATASET MIX ==========
phase_c:
  name: "Full Dataset Mix"
  purpose: "Expose broad geography and years, maintain generalization"
  
  updates: 600
  env_steps: 4_915_200  # 600 × 8192 ≈ 4.92M
  
  # Data settings (full diversity)
  scenario_pool_size: 116337  # All available fires
  fire_size_range: [5, 300]
  wind_speed_range: [0, 40]
  slope_variance: 0.5
  horizon: 200
  balanced_sampling: true
  
  # Geographic & Temporal diversity
  sample_years: [1308, 2024]  # Full range
  sample_states: "all_except_holdout"
  
  # LLM settings
  llm_cadence: 50
  llm_cache_enabled: true
  cache_target_hit_rate: 0.60
  
  # Reward weights (refined)
  reward_weights:
    containment_progress: 1.0
    area_saved: 1.5
    idle_penalty: 0.5
    resource_efficiency: 0.8
    strategy_alignment: 0.6
    terrain_adaptation: 0.4
  
  # PPO settings (anneal entropy)
  ppo:
    entropy_coef_start: 0.02
    entropy_coef_end: 0.005
    entropy_anneal: "linear"
    learning_rate: 3e-4
  
  # Early stop criteria
  early_stop:
    return_95ci_overlap_count: 3
    min_entropy: 0.01

# ========== PHASE D: QWEN FINE-TUNE (OPTIONAL) ==========
phase_d:
  name: "Qwen-Guidance Fine-Tune"
  purpose: "Strengthen strategy use without destabilizing PPO"
  
  updates: 250
  env_steps: 2_048_000  # 250 × 8192 ≈ 2.05M
  
  # Data settings (maintain full diversity)
  scenario_pool_size: 116337
  fire_size_range: [5, 300]
  balanced_sampling: true
  
  # LLM settings (optional: reduce cadence on complex scenarios)
  llm_cadence: 40  # More frequent guidance
  llm_cache_enabled: true
  
  # Reward weights (emphasize strategy)
  reward_weights:
    containment_progress: 1.0
    area_saved: 1.5
    idle_penalty: 0.5
    resource_efficiency: 0.8
    strategy_alignment: 1.0  # Upweighted
    guidance_consistency: 0.7
  
  # PPO settings (stable)
  ppo:
    entropy_coef: 0.005
    learning_rate: 1e-4  # Lower LR for fine-tuning
  
  # Early stop criteria
  early_stop:
    completion_rate_threshold: 0.90
    eval_consecutive_success: 3

# ========== SUMMARY ==========
total_env_steps: 13_120_000  # 13.12M
total_wall_time_estimate: "18-24 hours"
recommended_phases_for_isef: ["phase_a", "phase_b", "phase_c"]
optional_phase: "phase_d"

# Quick reference
quick_reference:
  steps_per_update: 8192
  updates_for_1M_steps: 122
  updates_for_10M_steps: 1221
