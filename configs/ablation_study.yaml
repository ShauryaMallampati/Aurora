defaults:
  phase: full
  total_timesteps: 401408
  n_envs: 1
  grid_size: 50
  num_drones: 3
  max_steps: 100
  llm_backend: transformers
  llm_model: Qwen/Qwen2.5-3B-Instruct
  guidance_interval: 50
  use_llm_guidance: true
  use_heuristic_strategist: false
  use_strategic_obs_channels: true
  use_strategy_reward: true
  evaluation_scenarios_source: evaluate.py:EVALUATION_FIRES
  evaluation_seed_note: docs/ANALYSIS.md defines easy seeds [1001, 2002] and hard seeds [3003, 4004]; evaluate.py separately defines a 5-seed helper battery that is not the basis of the paper claims
  seeds: [1001, 2002, 3003, 4004]
  easy_seeds: [1001, 2002]
  hard_seeds: [3003, 4004]
  llm_decoding:
    temperature: 0.7
    max_new_tokens: 256
    do_sample: false
  ppo:
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
  reward_coefficients:
    lambda_f: 10.0
    lambda_s: 2.0
    lambda_b: 1.0
    lambda_z: 1.0
  normalization_radius: 50

variants:
  ppo_only:
    llm_model: none
    use_llm_guidance: false
    use_heuristic_strategist: false
    use_strategic_obs_channels: false
    use_strategy_reward: false
    model_label: aurora_ppo_only

  full_hybrid:
    use_llm_guidance: true
    use_heuristic_strategist: false
    use_strategic_obs_channels: true
    use_strategy_reward: true
    model_label: aurora_full_hybrid

  heuristic_strategist:
    llm_model: none
    use_llm_guidance: false
    use_heuristic_strategist: true
    use_strategic_obs_channels: true
    use_strategy_reward: true
    model_label: aurora_heuristic_strategist

  reward_only:
    use_llm_guidance: true
    use_heuristic_strategist: false
    use_strategic_obs_channels: false
    use_strategy_reward: true
    model_label: aurora_reward_only

  obs_only:
    use_llm_guidance: true
    use_heuristic_strategist: false
    use_strategic_obs_channels: true
    use_strategy_reward: false
    model_label: aurora_obs_only

model_variants:
  qwen2_5_3b:
    base_variant: full_hybrid
    llm_model: Qwen/Qwen2.5-3B-Instruct
    model_label: aurora_qwen2_5_3b

  qwen2_5_7b:
    base_variant: full_hybrid
    llm_model: Qwen/Qwen2.5-7B-Instruct
    model_label: aurora_qwen2_5_7b

families:
  budget_matched_ppo:
    variants: [ppo_only]

  core_variants:
    variants: [ppo_only, qwen2_5_3b, qwen2_5_7b]

  heuristic_strategist:
    variants: [heuristic_strategist]

  mechanism_ablation:
    variants: [ppo_only, reward_only, obs_only, full_hybrid, heuristic_strategist]

  cadence_ablation:
    base_variant: qwen2_5_3b
    cadence_multipliers:
      dense: 0.5
      baseline: 1.0
      sparse: 2.0
